name: Build OPD2515 exact Galaxy candidate

on:
  workflow_dispatch:
  push:
    branches: [opd2515]

permissions:
  contents: read

env:
  OPD_KERNEL_COMMIT: 7704a1ae279baec7789f6e19079cc4e80e62fa41
  OPD_KERNEL_RELEASE: 6.12.58-android16-6-g7704a1ae279b-ab15213644-4k
  OPD_KERNEL_LOCALVERSION: -android16-6-g7704a1ae279b-ab15213644-4k
  OPD_BUILD_ID: 15213644

jobs:
  build-exact-ko:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev libdw-dev libdwarf-dev cpio rsync python3 clang llvm lld

      - name: Fetch exact Android common kernel source
        run: |
          mkdir -p opd-kernel
          curl --fail --retry 8 --retry-delay 3 -L \
            "https://android.googlesource.com/kernel/common/+archive/${OPD_KERNEL_COMMIT}.tar.gz" \
            | tar -xz -C opd-kernel
          printf '%s\n' "$OPD_KERNEL_COMMIT" > opd-kernel/.source-commit
          test -f opd-kernel/Makefile
          test "$(cat opd-kernel/.source-commit)" = "$OPD_KERNEL_COMMIT"

      - name: Fetch exact OPD2515 GKI build inputs
        run: |
          mkdir -p opd-inputs
          base="https://ci.android.com/builds/submitted/${OPD_BUILD_ID}/kernel_aarch64/latest/raw"
          curl --fail --retry 5 --retry-delay 2 -L "$base/kernel_aarch64_dot_config" -o opd-inputs/.config
          curl --fail --retry 5 --retry-delay 2 -L "$base/vmlinux.symvers" -o opd-inputs/vmlinux.symvers
          grep -q 'Linux/arm64 6.12.58 Kernel Configuration' opd-inputs/.config
          sha256sum opd-inputs/.config opd-inputs/vmlinux.symvers

      - name: Prepare exact kernel tree
        run: |
          mkdir -p opd-out
          cp opd-inputs/.config opd-out/.config
          # The Android CI kernel release includes the Android build suffix in
          # CONFIG_LOCALVERSION.  The source archive has no git metadata, so
          # set that value explicitly before olddefconfig; otherwise a plain
          # GKI prepare reports only 6.12.58-4k and the module vermagic would
          # not match the tablet's uname -r.
          sed -i '/^CONFIG_LOCALVERSION=/d' opd-out/.config
          printf 'CONFIG_LOCALVERSION="%s"\n' "$OPD_KERNEL_LOCALVERSION" >> opd-out/.config
          make -C opd-kernel O="$GITHUB_WORKSPACE/opd-out" ARCH=arm64 LLVM=1 olddefconfig modules_prepare
          # Keep the CI vmlinux symbol table separate.  Passing it both as
          # O/Module.symvers and KBUILD_EXTRA_SYMBOLS makes modpost see every
          # exported symbol twice.
          rm -f opd-out/Module.symvers
          actual_release="$(make -s -C opd-kernel O="$GITHUB_WORKSPACE/opd-out" ARCH=arm64 LLVM=1 kernelrelease)"
          echo "expected kernel release: $OPD_KERNEL_RELEASE"
          echo "actual kernel release:   $actual_release"
          test "$actual_release" = "$OPD_KERNEL_RELEASE"
          # External modules include SELinux's generated private headers, but
          # a source archive plus modules_prepare does not build them.  The
          # GKI config may leave CONFIG_SECURITY_SELINUX unset, in which case
          # security/selinux/selinux.o has no Kbuild target at all.  Generate
          # the two headers directly with the kernel's own generator instead
          # of trying to link the whole SELinux object.
          make -C opd-kernel O="$GITHUB_WORKSPACE/opd-out" ARCH=arm64 LLVM=1 \
            scripts/selinux/genheaders/genheaders
          mkdir -p opd-out/security/selinux
          opd-out/scripts/selinux/genheaders/genheaders \
            opd-out/security/selinux/flask.h \
            opd-out/security/selinux/av_permissions.h
          test -s opd-out/security/selinux/flask.h
          test -s opd-out/security/selinux/av_permissions.h

      - name: Build and verify exact OPD2515 module
        run: |
          # The standalone source archive does not carry Kleaf's generated
          # GKI protected-module list.  The plain external-module Kbuild path
          # still declares it as an input when MODULE_SIG_PROTECT is enabled;
          # an empty list preserves the vendor GKI config while allowing the
          # out-of-tree module to be checked against the supplied Module.symvers.
          : > opd-kernel/protected_module_names_list
          rm -f opd-out/Module.symvers
          make -C opd-kernel O="$GITHUB_WORKSPACE/opd-out" M="$GITHUB_WORKSPACE/lkm" \
            ARCH=arm64 LLVM=1 KBUILD_EXTRA_SYMBOLS="$GITHUB_WORKSPACE/opd-inputs/vmlinux.symvers" modules
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack -R .BTF -R .BTF.base \
            -R .llvm_addrsig -R .hyp.text -R .hyp.bss -R .hyp.rodata \
            -R .hyp.event_ids -R .hyp.patchable_function_entries \
            -R .hyp.data lkm/dfroot.ko
          mkdir -p app/src/main/jni/ko out
          cp lkm/dfroot.ko app/src/main/jni/ko/dirtyfrag-android16-6.12.ko
          cp lkm/dfroot.ko out/dirtyfrag-opd2515-6.12.ko
          strings out/dirtyfrag-opd2515-6.12.ko | tee out/dirtyfrag-opd2515-strings.txt
          grep -F "vermagic=$OPD_KERNEL_RELEASE" out/dirtyfrag-opd2515-strings.txt
          grep -F 'name=dfroot' out/dirtyfrag-opd2515-strings.txt
          sha256sum out/dirtyfrag-opd2515-6.12.ko

      - name: Checkout and patch KernelSU for managerless bootstrap
        run: |
          git clone --depth 1 --branch v3.3.0 https://github.com/tiann/KernelSU.git kernelsu
          git -C kernelsu apply "$GITHUB_WORKSPACE/tools/kernelsu-oneapk.patch"

      - name: Build exact managerless KernelSU LKM
        run: |
          # Android's 6.12 GKI module headers carry a vendor namespace
          # implementation that emits an empty import descriptor for this
          # external module.  The late-load loader resolves symbols manually;
          # there is no namespace dependency to preserve in the generated
          # mod.c, so drop only the optional metadata directive before
          # invoking modpost.  This does not change the module code path.
          sed -i '/^[[:space:]]*MODULE_IMPORT_NS(/d' kernelsu/kernel/core/init.c
          make -C opd-kernel O="$GITHUB_WORKSPACE/opd-out" \
            M="$GITHUB_WORKSPACE/kernelsu/kernel" \
            src="$GITHUB_WORKSPACE/kernelsu/kernel" \
            ARCH=arm64 LLVM=1 CONFIG_KSU=m \
            CONFIG_KSU_DISABLE_MANAGER=y CONFIG_KSU_DISABLE_POLICY=y \
            CONFIG_EXTENDED_MODVERSIONS=n CONFIG_BASIC_MODVERSIONS=n \
            CONFIG_MODULE_SIG_PROTECT=n CONFIG_TRIM_UNUSED_KSYMS=n \
            KCFLAGS="-I$GITHUB_WORKSPACE/opd-out/security/selinux -Wno-unused-variable" \
            KBUILD_MODPOST_WARN=1 modules
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack -R .BTF -R .BTF.base \
            -R .llvm_addrsig -R .hyp.text -R .hyp.bss -R .hyp.rodata \
            -R .hyp.event_ids -R .hyp.patchable_function_entries \
            -R .hyp.data kernelsu/kernel/kernelsu.ko
          cp kernelsu/kernel/kernelsu.ko out/android16-6.12_kernelsu.ko
          strings out/android16-6.12_kernelsu.ko | tee out/android16-6.12_kernelsu-strings.txt
          grep -F "vermagic=$OPD_KERNEL_RELEASE" out/android16-6.12_kernelsu-strings.txt
          sha256sum out/android16-6.12_kernelsu.ko

      - uses: actions/upload-artifact@v4
        with:
          name: dirtyfrag-galaxy-opd2515-ko
          path: |
            out/dirtyfrag-opd2515-6.12.ko
            out/dirtyfrag-opd2515-strings.txt
            out/android16-6.12_kernelsu.ko
            out/android16-6.12_kernelsu-strings.txt

  build-ksud-oneapk:
    needs: build-exact-ko
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dirtyfrag-galaxy-opd2515-ko
          path: out
      - name: Checkout patched KernelSU userspace
        run: |
          git clone --depth 1 --branch v3.3.0 https://github.com/tiann/KernelSU.git kernelsu
          git -C kernelsu apply "$GITHUB_WORKSPACE/tools/kernelsu-oneapk.patch"
      - name: Stage exact KernelSU assets
        run: |
          mkdir -p kernelsu/userspace/ksud/bin/aarch64
          cp out/android16-6.12_kernelsu.ko \
            kernelsu/userspace/ksud/bin/aarch64/android16-6.12_kernelsu.ko
          curl --fail --retry 5 --retry-delay 2 -L \
            https://github.com/tiann/KernelSU/releases/download/v3.3.0/ksuinit-aarch64 \
            -o kernelsu/userspace/ksud/bin/aarch64/ksuinit
          chmod 0755 kernelsu/userspace/ksud/bin/aarch64/ksuinit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - name: Build managerless ksud
        working-directory: kernelsu
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          KSU_PACKAGE_NAME: dirtyfrag.galaxy
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          sed -i 's#https://github.com/Kernel-SU/adb_client#https://github.com/cocool97/adb_client#g' \
            userspace/ksud/Cargo.toml
          sed -i 's#https://github.com/Kernel-SU/java-properties.git#https://github.com/KernelSU-Next/java-properties.git#g' \
            userspace/ksud/Cargo.toml
          sed -i 's#https://github.com/Kernel-SU/ksu_props#https://github.com/5ec1cff/resetprop-rs#g' \
            userspace/ksud/Cargo.toml
          sed -i 's#https://github.com/Kernel-SU/rustix#https://github.com/KernelSU-Next/rustix#g' \
            userspace/ksuinit/Cargo.toml
          rustup update stable
          rustup target add aarch64-linux-android
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          cargo build --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml
          cp "target/$TRIPLE/release/ksud" "$GITHUB_WORKSPACE/ksud-oneapk"
          chmod 0755 "$GITHUB_WORKSPACE/ksud-oneapk"
          file "$GITHUB_WORKSPACE/ksud-oneapk"
      - uses: actions/upload-artifact@v4
        with:
          name: ksud-opd2515-oneapk
          path: ksud-oneapk

  build-apk:
    needs: [build-exact-ko, build-ksud-oneapk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dirtyfrag-galaxy-opd2515-ko
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: ksud-opd2515-oneapk
          path: out/ksud
      - name: Install exact OPD2515 module into the APK
        run: |
          cp out/dirtyfrag-opd2515-6.12.ko app/src/main/jni/ko/dirtyfrag-android16-6.12.ko
          cp out/ksud/ksud-oneapk app/src/main/assets/ksud
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build OPD2515 candidate APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DirtyFrag-Galaxy-OPD2515-debug
          path: app/build/outputs/apk/debug/dirtyfrag-galaxy.apk
